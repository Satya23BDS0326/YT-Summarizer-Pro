name: Deploy to Hugging Face
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      # This step strips out the images right before sending the code to Hugging Face
      - name: Clean binary files for Hugging Face
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git rm -r --cached screenshots/ || true
          rm -rf screenshots/
          git add -A
          git commit -m "Strip binary files for HF deployment" || true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://satyaballa:$HF_TOKEN@huggingface.co/spaces/satyaballa/YT_Summarizer_Pro HEAD:main
